    <div class="modal fade" id="settingModal" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
          <div class="modal-body">
            <div class="mb-4">
              <label for="portNum" class="form-label">포트 번호</label>
